name: CI / Deploy

# Push to main → test → build → deploy. Pull requests run the tests only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            # a manual "Run workflow" button
    inputs:
      skip_tests:
        description: "Deploy without running tests (emergency only)"
        type: boolean
        default: false

concurrency:
  # Never let two deploys race onto the same server. A newer push supersedes
  # a queued one, but an in-flight deploy is allowed to finish.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "20"

jobs:
  # ── 1. the money code ─────────────────────────────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: braelaspin_test
          POSTGRES_USER: braelaspin
          POSTGRES_PASSWORD: devpassword
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U braelaspin"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      # The integration suite is the point: the concurrency tests are what
      # prove the lost-update, skipped-debit and unreconciled-payout bugs are
      # absent. Running them under -race as well would double CI time for
      # little extra signal, so -race runs on the unit suite only.
      - name: Tests (unit + integration, real Postgres)
        env:
          TEST_DATABASE_URL: postgres://braelaspin:devpassword@localhost:5433/braelaspin_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380
        run: go test ./... -count=1

      - name: Money-path race detector
        env:
          TEST_DATABASE_URL: postgres://braelaspin:devpassword@localhost:5433/braelaspin_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380
        run: go test ./internal/wallet/ ./internal/game/ -count=1 -race

  # ── 2. the web client ─────────────────────────────────────────────────────
  test-web:
    name: Web checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Fails the build if anything in core/ touches the DOM or imports ui/.
      # That rule is what keeps the logic portable to Flutter.
      - name: Core purity (no DOM in src/core)
        run: npm run check:core

      - name: Unit tests
        run: npx vitest run

      - name: Build and enforce the size budget
        run: |
          VITE_API_BASE="" npx vite build
          BYTES=$(find dist -type f ! -name '*.map' -exec stat -c %s {} + | paste -sd+ | bc)
          KB=$((BYTES / 1024))
          echo "bundle: ${KB} KB (raw, excluding sourcemaps)"
          # The whole argument for zero runtime dependencies is size. If a
          # package sneaks in, this is where it gets noticed.
          if [ "$KB" -gt 250 ]; then
            echo "::error::bundle is ${KB} KB, over the 250 KB budget"
            exit 1
          fi

  # ── 3. deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    # Only from main, and only if the tests passed (or were explicitly skipped).
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      !cancelled() &&
      (needs.test-api.result == 'success' || inputs.skip_tests) &&
      (needs.test-web.result == 'success' || inputs.skip_tests)
    environment:
      name: staging
      url: http://68.183.91.240

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Static, so the server needs no Go toolchain — it runs live MT5 trading
      # and has no business hosting a compiler.
      - name: Build the API (static linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" \
            -o build/braelaspin ./cmd/api
          ls -lh build/braelaspin

      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          VITE_API_BASE="" npx vite build

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned host key, not StrictHostKeyChecking=no — otherwise the
          # first connection would accept any machine claiming that address.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Ship artifacts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            build/braelaspin "$HOST:/opt/braelaspin/bin/braelaspin.new"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            web/dist/ "$HOST:/opt/braelaspin/web/"

      - name: Migrate, swap binary, restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/braelaspin

          # Keep the outgoing binary so rollback is one command.
          if [ -f bin/braelaspin ]; then
            cp bin/braelaspin "releases/braelaspin.$(date +%Y%m%d-%H%M%S)"
            ls -1t releases/ | tail -n +6 | xargs -r -I{} rm -f "releases/{}"
          fi

          chmod +x bin/braelaspin.new
          mv -f bin/braelaspin.new bin/braelaspin

          set -a; . ./.env; set +a
          ./bin/braelaspin migrate up
          sudo systemctl restart braelaspin
          sudo systemctl reload caddy 2>/dev/null || sudo systemctl restart caddy

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "API failed to become healthy — rolling back"
          LAST=$(ls -1t releases/ | head -1)
          [ -n "$LAST" ] && cp "releases/$LAST" bin/braelaspin && sudo systemctl restart braelaspin
          sudo journalctl -u braelaspin -n 40 --no-pager
          exit 1
          REMOTE

      - name: Smoke test from the public internet
        run: |
          BASE=http://68.183.91.240
          for path in /healthz /; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          echo "### Deployed [\`${GITHUB_SHA::7}\`]($BASE)" >> "$GITHUB_STEP_SUMMARY"
          curl -s "$BASE/healthz" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm MT5 was not disturbed
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        # This host runs live trading. Every deploy asserts the trading stack
        # is still up, so a regression is caught by CI rather than by a
        # missed trade.
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$HOST" '
            terms=$(pgrep -fc terminal64.exe || echo 0)
            units=$(systemctl --user list-units --type=service --no-pager --no-legend 2>/dev/null | wc -l)
            echo "MT5 terminals: $terms | user units: $units"
            [ "$terms" -ge 1 ] || { echo "::error::MT5 terminals are not running"; exit 1; }
          '
